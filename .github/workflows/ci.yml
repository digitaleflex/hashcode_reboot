name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck · Lint · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:orientation-hardening
      - run: npm run test:recommendation-presentation
      - run: npm run test:orientation-catalogue
      - run: npm run test:anti-abuse
      - run: npm run test:retention
      - run: npm run test:missions-engine
      - run: npm run test:admin-dates
      - run: npm run test:segments
      - run: npm run test:lead-quality
      - run: npm run test:roadmap-status
      - run: npm run test:dedup
      - run: npm run test:trust-collection
      - run: npm run test:analytics-dictionary
      - run: npm run test:public-events
      - run: npm run test:auth-ui
      - name: Validate translation keys
        run: node scripts/check-messages.mjs
      - name: Validate design token contrast
        run: node scripts/check-contrast.mjs

  detect-secrets:
    name: Detect CI secrets
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - id: check
        env:
          DB: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DB" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    needs: [validate, detect-secrets]
    if: needs.detect-secrets.outputs.has-secrets == 'true'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      # NOTE : voir job lighthouse — NODE_ENV=production global casserait
      # `npm ci` (devDeps omises). Posé uniquement sur build + start.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          NODE_ENV: production
      - name: Start app
        run: npm run start &
      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App did not start in time"
          exit 1
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  integration:
    name: Integration (ephemeral Postgres)
    runs-on: ubuntu-latest
    # Calque le job e2e (même Node, même install) mais SANS condition
    # secrets : la DB est fournie par le service éphémère ci-dessous, et
    # l'auth admin de test est posée via Prisma dans le fichier lui-même
    # (aucun provider d'email requis — seuls des emails inconnus touchent
    # la voie anti-énumération). Ne dépend que de validate.
    needs: [validate]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hashcode
          POSTGRES_PASSWORD: hashcode
          POSTGRES_DB: hashcode_reboot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hashcode -d hashcode_reboot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hashcode:hashcode@localhost:5432/hashcode_reboot_test?schema=public
      BETTER_AUTH_SECRET: integration-test-secret-32-chars-minimum-ok
      NODE_ENV: test
      # Parité avec le job lighthouse : certaines routes exigent l'URL
      # WhatsApp à l'exécution (ex. GET /api/community/join → 503 sinon).
      NEXT_PUBLIC_WHATSAPP_URL: https://chat.whatsapp.com/IDcosEG4jjOK4mTAYsX92D
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: node --test tests/integration.test.cjs
        timeout-minutes: 15

  e2e-funnel:
    name: E2E funnel acquisition (ephemeral Postgres + Chromium)
    runs-on: ubuntu-latest
    # Preuve durable de #113 : tunnel complet sur base éphémère + build prod.
    # Le job e2e classique reste sous condition secrets ; celui-ci est
    # autonome (pas de secret requis) et ne lance QUE la spec funnel,
    # gardée par FUNNEL_DATABASE_URL (jamais dev/prod).
    needs: [validate]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hashcode
          POSTGRES_PASSWORD: hashcode
          POSTGRES_DB: hashcode_reboot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hashcode -d hashcode_reboot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hashcode:hashcode@localhost:5432/hashcode_reboot_test?schema=public
      FUNNEL_DATABASE_URL: postgresql://hashcode:hashcode@localhost:5432/hashcode_reboot_test?schema=public
      BETTER_AUTH_SECRET: e2e-test-secret-32-chars-minimum-ok
      BASE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_URL: http://localhost:3000
      NEXT_PUBLIC_APP_VERSION: ci
      NEXT_PUBLIC_WHATSAPP_URL: https://chat.whatsapp.com/IDcosEG4jjOK4mTAYsX92D
      NEXT_PUBLIC_MEET_URL: https://meet.google.com/pdr-qjei-zkk
      NEXT_TELEMETRY_DISABLED: "1"
      # NOTE (cf. lighthouse) : pas de NODE_ENV global (npm ci omettrait
      # les devDeps). Posé uniquement sur l'étape build.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
        env:
          NODE_ENV: production
      - name: Start app
        run: npm run start &
      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 5
          done
          echo "App did not start in time"
          exit 1
      - name: Funnel E2E (Chromium)
        run: npx playwright test tests/e2e/funnel-acquisition.spec.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: funnel-e2e-report
          path: test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI (landing)
    runs-on: ubuntu-latest
    # Autonome : n'exige aucun secret (la landing ne touche pas la base au
    # rendu). Verrouille des seuils de perf/a11y/SEO sur `/` (lighthouserc.json).
    needs: [validate]
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_URL: http://localhost:3000
      NEXT_PUBLIC_APP_VERSION: ci
      NEXT_PUBLIC_WHATSAPP_URL: https://chat.whatsapp.com/IDcosEG4jjOK4mTAYsX92D
      NEXT_PUBLIC_MEET_URL: https://meet.google.com/pdr-qjei-zkk
      BETTER_AUTH_SECRET: ci-not-a-real-secret-only-for-build
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      NEXT_TELEMETRY_DISABLED: "1"
      # NOTE : pas de NODE_ENV global ici — `npm ci` avec NODE_ENV=production
      # omet les devDependencies (dont @tailwindcss/postcss) et le build
      # Turbopack échoue sur globals.css. NODE_ENV=production est posé
      # uniquement sur l'étape de build (next le force de toute façon).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          NODE_ENV: production
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: lhci/
          retention-days: 7
