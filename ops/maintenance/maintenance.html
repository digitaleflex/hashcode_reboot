<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="refresh" content="20" />
<title>HASHCODE REBOOT — Mise à jour en cours</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #0b0b0d; color: #f2f2f0;
    font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
  }
  main { max-width: 560px; text-align: center; }
  .logo {
    font-weight: 800; letter-spacing: 0.18em; font-size: 14px;
    color: #c5f441; margin-bottom: 20px;
  }
  h1 { font-size: clamp(24px, 4vw, 34px); line-height: 1.2; margin-bottom: 12px; }
  p { color: #a3a3ab; line-height: 1.6; margin-bottom: 8px; }
  .bar {
    height: 3px; background: #26262b; border-radius: 2px;
    margin: 24px auto 0; max-width: 320px; overflow: hidden;
  }
  .bar > span {
    display: block; height: 100%; width: 40%;
    background: #c5f441; border-radius: 2px;
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bar > span { animation: none; width: 100%; }
  }
</style>
</head>
<body>
<main>
  <div class="logo">HASHCODE&nbsp;REBOOT</div>
  <h1>Mise à jour en cours</h1>
  <p>Le site revient dans une minute environ.<br />Cette page se recharge toute seule.</p>
  <div class="bar" aria-hidden="true"><span></span></div>
</main>
</body>
</html>
